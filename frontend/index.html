<!DOCTYPE html>
<html>
<head>
    <title>SmartPay Guard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f8;
        }

        .container {
            max-width: 700px;
            margin: 60px auto;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        textarea,
        input[type="file"] {
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        textarea {
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            white-space: pre-line;
            border-radius: 8px;
        }

        .low {
            background-color: #d4edda;
        }

        .suspicious {
            background-color: #fff3cd;
        }

        .high {
            background-color: #f8d7da;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🛡️ SmartPay Guard</h1>

        <p class="subtitle">
            Analyze suspicious messages or text files.
        </p>

        <h3>Analyze a Message</h3>

        <textarea
            id="message"
            rows="6"
            placeholder="Paste or type a suspicious message here..."
        ></textarea>

        <button onclick="analyzeMessage()">
            Analyze Message
        </button>

        <hr>

        <h3>Analyze a Text File</h3>

        <input
            type="file"
            id="fileInput"
            accept=".txt"
        >

        <button onclick="analyzeFile()">
            Upload and Analyze File
        </button>

        <div id="result">
            No message or file analyzed yet.
        </div>

    </div>

    <script>
        function displayResult(data) {
            const resultDiv = document.getElementById("result");

            resultDiv.className = "";

            resultDiv.innerText =
                "Risk Score: " + data.risk_score +
                "\nRisk Level: " + data.risk_level +
                "\nReasons: " + data.reasons.join(", ");

            if (data.risk_level === "LOW") {
                resultDiv.classList.add("low");
            } else if (data.risk_level === "SUSPICIOUS") {
                resultDiv.classList.add("suspicious");
            } else if (data.risk_level === "HIGH") {
                resultDiv.classList.add("high");
            }
        }


        async function analyzeMessage() {
            const message = document.getElementById("message").value;
            const resultDiv = document.getElementById("result");

            resultDiv.className = "";
            resultDiv.innerText = "Analyzing message...";

            try {
                const response = await fetch(
                    "http://127.0.0.1:8000/analyze",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            message: message
                        })
                    }
                );

                const data = await response.json();
                displayResult(data);

            } catch (error) {
                resultDiv.innerText =
                    "Error connecting to the backend.";
                console.error(error);
            }
        }


        async function analyzeFile() {
            const fileInput =
                document.getElementById("fileInput");

            const resultDiv =
                document.getElementById("result");

            if (fileInput.files.length === 0) {
                resultDiv.innerText =
                    "Please select a .txt file first.";
                return;
            }

            const formData = new FormData();

            formData.append(
                "file",
                fileInput.files[0]
            );

            resultDiv.className = "";
            resultDiv.innerText = "Analyzing file...";

            try {
                const response = await fetch(
                    "http://127.0.0.1:8000/analyze-file",
                    {
                        method: "POST",
                        body: formData
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    resultDiv.innerText =
                        "Error: " +
                        (data.detail || "Unable to analyze file.");
                    return;
                }

                displayResult(data);

            } catch (error) {
                resultDiv.innerText =
                    "Error connecting to the backend.";
                console.error(error);
            }
        }
    </script>

</body>
</html>
